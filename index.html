<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EG Nexus</title>
    <!-- CDN Estable de Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Color extraído del fondo inferior de tu imagen principal */
        .bg-exact-nexus {
            background-color: #1a3249;
        }
    </style>
</head>
<body class="bg-exact-nexus text-slate-200 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <!-- Sección del Arte Principal (Fondo Integrado) -->
    <header class="w-full flex justify-center bg-[#1e344a]">
        <div class="w-full max-w-2xl">
            <img src="fondo.jpg" alt="EG Nexus - Próximamente" class="w-full h-auto object-contain block">
        </div>
    </header>

    <!-- Contenido Inferior: Tarjeta Replicada de Alta Visibilidad -->
    <main class="flex-grow flex flex-col items-center justify-start px-4 pt-4 pb-16">
        <div class="w-full max-w-xl bg-slate-900/30 border border-white/5 rounded-2xl p-6 md:p-8 shadow-2xl backdrop-blur-md grid grid-cols-12 gap-6 items-center">
            
            <!-- Bloque Izquierdo: Logotipo Centrado -->
            <div class="col-span-12 sm:col-span-4 flex justify-center items-center sm:border-r sm:border-white/10 sm:pr-4">
                <img src="logo.jpg" alt="EG Nexus" class="w-28 h-auto object-contain rounded bg-white/5 p-1">
            </div>

            <!-- Bloque Derecho: Estructura exacta de la Imagen en Blanco -->
            <div class="col-span-12 sm:col-span-8 space-y-4 pl-0 sm:pl-2">
                <!-- Títulos Principales -->
                <div>
                    <h2 class="text-lg font-bold text-white tracking-tight">Equipo Comercial | EG Nexus</h2>
                    <p class="text-xs text-emerald-400 font-medium tracking-wide mt-0.5">EG Nexus Digital Growth Marketing</p>
                </div>

                <!-- Lista de Contacto con Hipervínculos Interactivos Reales -->
                <div class="space-y-2.5 text-sm text-white">
                    <!-- WhatsApp Link -->
                    <a href="https://wa.me" target="_blank" class="flex items-center gap-2.5 hover:text-emerald-400 transition font-medium group">
                        <span class="text-emerald-400 font-bold group-hover:scale-110 transition flex-shrink-0">📞</span>
                        <span><strong>WhatsApp:</strong> +52 56 6506 2699</span>
                    </a>
                    
                    <!-- Web Link -->
                    <a href="https://egnexus.com.mx" class="flex items-center gap-2.5 hover:text-blue-400 transition font-medium group">
                        <span class="text-blue-400 font-bold group-hover:scale-110 transition flex-shrink-0">🌐</span>
                        <span><strong>Web:</strong> egnexus.com.mx</span>
                    </a>
                    
                    <!-- Correo Link -->
                    <a href="mailto:growth@egnexus.com.mx" class="flex items-center gap-2.5 hover:text-teal-400 transition font-medium group">
                        <span class="text-teal-400 font-bold group-hover:scale-110 transition flex-shrink-0">✉️</span>
                        <span class="break-all"><strong>Correo:</strong> growth@egnexus.com.mx</span>
                    </a>
                </div>

                <!-- Eslogan en Itálica (Estilo de la Tarjeta) -->
                <div class="pt-2 border-t border-white/10">
                    <p class="text-xs italic text-slate-300 font-normal leading-relaxed">
                        Estrategias digitales orientadas al crecimiento de tu negocio.
                    </p>
                </div>
            </div>

        </div>
    </main>

    <!-- Pie de Página Fijo -->
    <footer class="border-t border-white/5 bg-slate-950/20 py-4 text-center text-[10px] text-slate-500">
        <div class="max-w-xl mx-auto px-4 flex justify-between items-center">
            <p>© 2026 EG Nexus. Todos los derechos reservados.</p>
            <p class="font-semibold tracking-wider text-slate-400">EG NEXUS</p>
        </div>
    </footer>

</body>
</html>
