<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EG Nexus</title>
    <!-- CDN Estable de Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Color sólido corporativo extraído exactamente del tono inferior de tu imagen de fondo */
        .bg-solid-nexus {
            background-color: #0b1c2e;
        }
    </style>
</head>
<body class="bg-solid-nexus text-slate-200 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <!-- Sección del Arte Principal (Fondo Integrado) -->
    <header class="w-full flex justify-center bg-slate-950">
        <div class="w-full max-w-2xl">
            <!-- Carga la imagen de fondo directamente en su tamaño original estructurado -->
            <img src="fondo.jpg" alt="EG Nexus - Próximamente" class="w-full h-auto object-contain block">
        </div>
    </header>

    <!-- Contenido Inferior: Tarjeta de Contacto Integrada -->
    <main class="flex-grow flex flex-col items-center justify-start px-4 pt-4 pb-12">
        <div class="w-full max-w-md bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 shadow-2xl backdrop-blur-md">
            
            <!-- Encabezado de la Tarjeta con el Logo Ultra Pequeño -->
            <div class="flex items-center gap-3 mb-5 pb-4 border-b border-slate-800/60">
                <!-- Logotipo en formato miniatura corporativa -->
                <img src="logo.jpg" alt="EG Nexus" class="h-6 w-auto object-contain rounded bg-white/10 p-0.5">
                <div>
                    <h2 class="text-sm font-bold text-white tracking-tight">Equipo Comercial</h2>
                    <p class="text-[10px] text-emerald-400 font-semibold tracking-wider uppercase">Canales Oficiales</p>
                </div>
            </div>

            <!-- Canales de Contacto Directo -->
            <div class="space-y-3 text-xs">
                <!-- WhatsApp -->
                <a href="https://wa.me" target="_blank" class="flex items-center gap-3 text-slate-300 hover:text-emerald-400 transition group">
                    <div class="w-7 h-7 rounded-md bg-emerald-500/10 text-emerald-400 flex items-center justify-center border border-emerald-500/20 group-hover:bg-emerald-500 group-hover:text-slate-950 transition flex-shrink-0 font-bold text-[10px]">
                        W
                    </div>
                    <span class="font-medium text-slate-200 group-hover:text-emerald-400 transition">+52 56 6506 2699</span>
                </a>
                
                <!-- Sitio Web -->
                <a href="https://egnexus.com.mx" class="flex items-center gap-3 text-slate-300 hover:text-blue-400 transition group">
                    <div class="w-7 h-7 rounded-md bg-blue-500/10 text-blue-400 flex items-center justify-center border border-blue-500/20 group-hover:bg-blue-500 group-hover:text-white transition flex-shrink-0 font-bold text-[8px]">
                        WWW
                    </div>
                    <span class="font-medium text-slate-200 group-hover:text-blue-400 transition">egnexus.com.mx</span>
                </a>
                
                <!-- Correo Electrónico -->
                <a href="mailto:growth@egnexus.com.mx" class="flex items-center gap-3 text-slate-300 hover:text-blue-400 transition group">
                    <div class="w-7 h-7 rounded-md bg-slate-800 text-slate-400 flex items-center justify-center border border-slate-700 group-hover:bg-slate-200 group-hover:text-slate-950 transition flex-shrink-0 font-bold text-[10px]">
                        @
                    </div>
                    <span class="font-medium text-slate-200 group-hover:text-white transition break-all">growth@egnexus.com.mx</span>
                </a>
            </div>

            <!-- Eslogan de Cierre Sutil -->
            <div class="mt-5 pt-3 border-t border-slate-800/40 text-center">
                <p class="text-[10px] tracking-widest text-slate-500 font-medium uppercase">
                    EG Nexus
                </p>
            </div>
        </div>
    </main>

    <!-- Pie de Página Fijo -->
    <footer class="border-t border-slate-900 bg-slate-950/40 py-4 text-center text-[10px] text-slate-600">
        <div class="max-w-xl mx-auto px-4 flex justify-between items-center">
            <p>© 2026 EG Nexus. Reservados todos los derechos.</p>
            <p class="font-semibold tracking-wider">EG NEXUS</p>
        </div>
    </footer>

</body>
</html>
